<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base MIDI Keys</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #dde2e8;
  --ok: #1f8a4c; --bad: #c0392b; --warn: #b7791f; --accent: #6d4aff; --chip: #eef0f4; --press: #ffc400;
  --white-key: #ffffff; --black-key: #23262b; --key-edge: #9aa3ad;
  --mapped-white: #e4dcff; --mapped-black: #4a3d86; --sel: #6d4aff; --sel-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --card: #1d2026; --text: #e7eaee; --muted: #9aa4b1; --line: #2e333b;
    --ok: #3cc27a; --bad: #ff6b5b; --warn: #e0a83a; --accent: #9b85ff; --chip: #2a2e36; --press: #ffc400;
    --white-key: #e9ebee; --black-key: #0b0c0e; --key-edge: #5b636e;
    --mapped-white: #cfc3ff; --mapped-black: #4f3f9c; --sel: #8a6cff; --sel-text: #ffffff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 12px; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
.status { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }
.state { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; word-break: break-word; }
select, button { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.learning { background: var(--accent); color: #fff; border-color: var(--accent); }

/* the keyboard */
.kbd { display: flex; gap: 14px; align-items: stretch; }
.kbd svg { flex: 1; min-width: 0; height: auto; display: block; user-select: none; }
.kbd .side { display: flex; flex-direction: column; gap: 10px; width: 112px; flex: none; font-size: 12px; }
.ctl { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; cursor: pointer; }
.ctl.sel { outline: 2px solid var(--sel); }
.ctl .t { color: var(--muted); }
.ctl .v { font-weight: 700; font-size: 14px; }
.ctl.on { background: color-mix(in srgb, var(--press) 45%, transparent); }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; width: 0; background: var(--accent); }
.key { cursor: pointer; }
.key text { pointer-events: none; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
/* docked: the keyboard stays at the top while the list scrolls behind it */
.dock { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 10px; margin: -8px 0 0; }
.dock .card { box-shadow: 0 6px 14px -8px rgb(0 0 0 / .35); }
tbody tr { scroll-margin-top: calc(var(--dock-h, 0px) + 8px); }
@media (max-width: 640px) { .kbd { flex-direction: column; } .kbd .side { flex-direction: row; width: auto; } .kbd .side .ctl { flex: 1; } }

/* the table */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 10px; }
.toolbar .sub { margin: 0; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
tbody tr { cursor: pointer; }
tr.pressed td { background: color-mix(in srgb, var(--press) 30%, transparent); }
tr.sel td { box-shadow: inset 0 2px 0 var(--sel), inset 0 -2px 0 var(--sel); }
tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--sel), inset 0 2px 0 var(--sel), inset 0 -2px 0 var(--sel); }
tr.sel td:last-child { box-shadow: inset -2px 0 0 var(--sel), inset 0 2px 0 var(--sel), inset 0 -2px 0 var(--sel); }
.name { font-weight: 700; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
.what { color: var(--muted); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 1px 4px 1px 9px; margin: 2px 4px 2px 0; font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: nowrap; }
.chip button { border: none; background: none; padding: 0 5px; color: var(--muted); line-height: 1; }
.chip button:hover { color: var(--bad); }
.none { color: var(--muted); font-style: italic; font-size: 13px; }
.led { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
pre { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12px; overflow-x: auto; max-height: 260px; overflow-y: auto; margin: 0; }
.tablewrap { overflow-x: auto; }
tr.group td { cursor: default; background: var(--bg); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding-top: 14px; }
.chip .mod { color: var(--accent); font-weight: 700; }
@media (max-width: 640px) { .what { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Base MIDI keys</h1>

  <div class="status">
    <div class="card">
      <h2>MIDI keyboard</h2>
      <div class="state"><span class="dot" id="midiDot"></span><span id="midiState">Starting…</span></div>
      <div class="sub"><select id="midiIn" hidden></select></div>
      <div class="sub" id="lastMidi">Last: nothing yet</div>
    </div>
    <div class="card">
      <h2>Base station</h2>
      <div class="state"><span class="dot" id="baseDot"></span><span id="baseState">Asking the bridge…</span></div>
      <div class="sub" id="baseSub"></div>
    </div>
  </div>

  <div class="dock" id="dock"><div class="card">
    <div class="kbd">
      <svg id="kbd" role="img" aria-label="The MIDI keyboard"></svg>
      <div class="side">
        <div class="ctl" id="pedalBox" title="Sustain pedal"><div class="t">Sustain pedal</div><div class="v" id="pedalMap">—</div></div>
        <div class="ctl" id="sliderBox" title="Volume slider"><div class="t">Volume slider</div><div class="v" id="sliderMap">—</div>
          <div class="bar"><div id="sliderBar"></div></div><div class="t" id="sliderVal"></div></div>
      </div>
    </div>
    <p class="hint" id="kbdHint">Click a row below to see its keys here, or click a key here to find its row. Keys being pressed light up yellow.</p>
  </div></div>

  <div class="toolbar">
    <button id="allUp" title="Send key up for every key held on the base">Release all keys</button>
    <button id="reset">Reset to default mapping</button>
    <span class="sub" id="saveState"></span>
  </div>

  <div class="card tablewrap">
    <table>
      <thead><tr><th>Control</th><th>What it does</th><th>MIDI</th><th></th><th>LED</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <h2 class="sec">Base log</h2>
  <pre id="log"></pre>
</main>

<script>
"use strict";
// Rows scrolled to (a key clicked) land below the docked keyboard, not behind it.
new ResizeObserver(([e]) => document.documentElement.style.setProperty("--dock-h", e.target.offsetHeight + "px"))
  .observe(document.getElementById("dock"));
// What each base key does (firmware/base/main/controls.h).
const WHAT = {
  all: "Target: the whole shark", body: "Target: body (WLED)", eyes: "Target: eyes", fins: "Target: fins",
  page: "Tap: next page for the numbers (presets, palettes, layer looks); hold + number: brightness",
  latch: "Tap while a number or TAKE is held: keep it; held first + number: cue in Standby; + TAKE: Standby = Live",
  blackout: "Blackout while held; with PAGE held: pole power (on USB-C)",
  finsensor: "Tap: fins follow their real angle, or stay at the modelled angle",
  take: "Held: show Standby; + tap LATCH: swap Standby and Live",
  flash: "Flash while held",
  unlock: "Hold 1 s: lock or unlock the keypad",
  palette: "Modifier: hold to show the palette viewer; a number picks that row's palette, UP/DOWN scroll, PAGEUP/PAGEDOWN jump",
  left: "Palette viewer: a screenful back", right: "Palette viewer: a screenful on",
  pageup: "Palette viewer: a screenful back", pagedown: "Palette viewer: a screenful on",
  up: "Palette viewer: scroll back one (held: keeps scrolling, faster after 2 s)",
  down: "Palette viewer: scroll on one (held: keeps scrolling, faster after 2 s)",
  layer: "Modifier: hold, then a number 1-16 for that layer look",
  bright: "Modifier: hold, then a number 1-8 for the brightness in eighths",
  polepower: "Toggle the pole's power (only on a USB-C supply)",
};
let PALETTES = [];           // the palette keys' names, from the firmware
function what(k) {
  if (WHAT[k]) return WHAT[k];
  let m;
  if ((m = /^(\d+)$/.exec(k))) {
    const n = +m[1];
    return `Preset ${n} (bump while held)` + `; with PALETTE: the viewer's palette ${n} (if the set has one)` +
      `; with LAYER: layer look ${n}` + (n <= 8 ? `; with BRIGHT: brightness ${n}/8` : "");
  }
  if ((m = /^preset(\d+)$/.exec(k))) return `Preset ${m[1]}, whatever is held (bump while held)`;
  if ((m = /^palette(\d+)$/.exec(k))) return `Favourite palette ${m[1]}` + (PALETTES[m[1] - 1] ? `: ${PALETTES[m[1] - 1]}` : "") + ", on the target's own layer";
  if ((m = /^layer(\d+)$/.exec(k))) return `Layer look ${m[1]} (WLED preset ${100 + +m[1]}) over the target; LATCH on the live one turns it off`;
  if ((m = /^bright(\d+)$/.exec(k))) return `Brightness ${m[1]}/8 (${Math.floor(m[1] * 255 / 8)})`;
  return "";
}
// The table's sections, in order; a key goes in the first that takes it.
const GROUPS = [
  ["Numbers (presets; with a modifier held, what it says)", k => /^\d+$/.test(k)],
  ["Modifiers (hold, as on a computer)", k => MODS.includes(k)],
  ["Targets", k => ["all", "body", "eyes", "fins"].includes(k)],
  ["Palette viewer: scrolling", k => ["up", "down", "pageup", "pagedown", "left", "right"].includes(k)],
  ["Switcher", k => ["latch", "take", "flash", "blackout", "finsensor", "unlock", "polepower"].includes(k)],
  ["Presets, whatever is held", k => /^preset\d+$/.test(k)],
  ["Favourite palettes, whatever is held", k => /^palette\d+$/.test(k)],
  ["Layer looks, whatever is held", k => /^layer\d+$/.test(k)],
  ["Brightness", k => /^bright\d+$/.test(k) || isSlider(k)],
  ["Other", k => true],
];
const SLIDERS = { brightness: "WLED brightness, 0 (off) to 255; to the Live brain, Standby follows" };
const NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const CC_NAMES = { 1: "mod wheel", 7: "volume slider", 64: "sustain pedal", 66: "sostenuto pedal", 67: "soft pedal" };
const LOW = 36, HIGH = 84;   // the KeyStudio 49 at its centre octave: C2 .. C6
const BLACK = new Set([1, 3, 6, 8, 10]);
const BRI_MS = 80;           // brightness at most this often while the slider moves
// The KeyStudio's slider is noisy: untouched, it wanders about 5 steps (122..127
// seen). Its output only moves when the raw value leaves a band of +-SLIDER_H
// around it, and that output's range is stretched back to 0..127.
const SLIDER_H = 4;
// It also gives single wild readings (255 -> 145 -> 255 at rest). A move sends
// every step, so a reading more than SLIDER_JUMP from the last one is held
// until the next reading agrees with it, and dropped if it doesn't.
const SLIDER_JUMP = 20;

let keys = [];               // the base's key names, in its order
let MODS = ["palette", "layer", "bright", "page"];   // base modifiers a combination can hold
let activeFor = {};          // MIDI trigger held -> the base keys it holds down
let learnMods = new Set();   // learning: modifiers held for a combination
let learnHeld = new Set();   // learning: their MIDI triggers
let learnUsed = false;       // learning: a combination was recorded while they were held
let mapping = { buttons: {}, sliders: {} };
let learning = null;         // control waiting for a MIDI key or slider
let selected = null;         // control whose MIDI keys the picture shows
let pressed = new Set();     // base keys held down from MIDI
let triggerDown = new Set(); // MIDI triggers held ("note:60", "cc:64")
let ccValue = {};            // last value of each CC
let sliderOut = {};          // each slider's output after the hysteresis (0..127), once it has moved
let sliderRaw0 = {};         // the first value heard: no output until the slider moves away from it
let sliderLast = {};         // the last reading taken
let sliderHeld = {};         // a far-off reading waiting for the next one to agree
let midi = null, input = null;

const $ = id => document.getElementById(id);
const isSlider = c => c in SLIDERS;
const controls = () => [...keys, ...Object.keys(SLIDERS)];
const trigList = c => (isSlider(c) ? mapping.sliders : mapping.buttons)[c] || [];
const title = c => c === "brightness" ? "BRIGHTNESS" : c.toUpperCase();
const noteName = v => `${NOTE[v % 12]}${Math.floor(v / 12) - 1}`;
// A trigger: "note:60", or a combination "layer+note:60" (modifiers held, then the key).
const splitTrig = t => { const p = t.split("+"); return { mods: p.slice(0, -1), base: p[p.length - 1] }; };
const label = t => {
  const s = splitTrig(t);
  if (s.mods.length) return s.mods.map(title).join(" + ") + " + " + label(s.base);
  const [kind, n] = t.split(":"); const v = +n;
  if (kind === "note") return `${noteName(v)} (${v})`;
  return CC_NAMES[v] || "CC " + v;
};

// --- talking to the bridge, one request at a time so downs and ups stay in order
let chain = Promise.resolve();
function post(path, body) {
  chain = chain.then(() => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) }).catch(() => null));
  return chain;
}

const buttonsFor = t => keys.filter(k => (mapping.buttons[k] || []).includes(t));
const heldMods = () => MODS.filter(m => pressed.has(m));
// What a MIDI trigger does now: the combination for the modifiers held (the
// one holding the most of them), else its plain mapping.
function resolve(t) {
  const held = new Set(heldMods());
  let best = [], bestN = 0;
  for (const k of keys) for (const x of mapping.buttons[k] || []) {
    const s = splitTrig(x);
    if (s.base !== t || !s.mods.length || !s.mods.every(m => held.has(m))) continue;
    if (s.mods.length > bestN) { best = [k]; bestN = s.mods.length; }
    else if (s.mods.length === bestN) best.push(k);
  }
  return bestN ? best : buttonsFor(t);
}
const isHeld = k => Object.values(activeFor).some(l => l.includes(k));
const slidersFor = t => Object.keys(SLIDERS).filter(s => (mapping.sliders[s] || []).includes(t));
const controlsFor = t => [...buttonsFor(t), ...slidersFor(t)];

function setKey(name, down) {
  if (down === pressed.has(name)) return;
  down ? pressed.add(name) : pressed.delete(name);
  post("/api/key", { name, down });
  const row = document.querySelector(`tr[data-key="${CSS.escape(name)}"]`);
  if (row) row.classList.toggle("pressed", down);
}

function stopLearning() { learning = null; learnMods.clear(); learnHeld.clear(); learnUsed = false; }

function assign(control, t) {
  for (const k of keys) mapping.buttons[k] = (mapping.buttons[k] || []).filter(x => x !== t);
  for (const s of Object.keys(SLIDERS)) mapping.sliders[s] = (mapping.sliders[s] || []).filter(x => x !== t);
  const list = isSlider(control) ? mapping.sliders : mapping.buttons;
  (list[control] = list[control] || []).push(t);
  stopLearning();
  selected = control;
  save(); render();
}

function showLast(t, what) {
  const c = (what === "up" ? activeFor[t] || [] : what === "down" ? resolve(t) : []).concat(slidersFor(t));
  $("lastMidi").textContent = `Last: ${label(t)} ${what}` + (c.length ? ` → ${c.map(title).join(", ")}` : " (not mapped)");
}

// Learning a key: a MIDI key that is a modifier's is held as that modifier;
// another key pressed meanwhile records the combination ("LAYER + E4"). A
// modifier's key tapped alone is mapped by itself.
function learnTrigger(t, down) {
  const mod = buttonsFor(t).find(k => MODS.includes(k) && k !== learning);
  if (down && mod) { learnMods.add(mod); learnHeld.add(t); render(); return; }
  if (down) {
    const mods = MODS.filter(m => learnMods.has(m));
    if (mods.length) learnUsed = true;
    return assign(learning, [...mods, t].join("+"));
  }
  if (!learnHeld.has(t)) return;
  learnHeld.delete(t);
  learnMods.delete(mod);
  if (!learnUsed && !learnHeld.size) assign(learning, t);
  else render();
}

// A key or pedal went down or up. Down: it holds down what it does now (a
// combination if its modifiers are held, else its plain mapping); up lets go
// of the same keys, whatever was let go of in between. A base key held by two
// triggers (a key and the pedal) stays down while either is.
function trigger(t, down) {
  showLast(t, down ? "down" : "up");
  if (learning && !isSlider(learning)) return learnTrigger(t, down);
  if (down === triggerDown.has(t)) return;
  down ? triggerDown.add(t) : triggerDown.delete(t);
  const ks = down ? resolve(t) : activeFor[t] || [];
  if (down) activeFor[t] = ks; else delete activeFor[t];
  for (const k of ks) setKey(k, isHeld(k));
  drawKeyboard();
}

// --- brightness from a slider: the newest value, at most every BRI_MS.
// Sent from the slider's own messages; the timer only sends where it stopped
// (Chrome slows timers to about once a second in a hidden tab, which would
// otherwise squash a whole move into one late send).
let briWant = null, briSent = null, briTimer = null, briLast = 0;
function briSend() {
  clearTimeout(briTimer);
  briTimer = null;
  if (briWant === briSent) return;
  briSent = briWant; briLast = performance.now();
  post("/api/brightness", { value: briSent });
}
function brightness(v) {
  briWant = v;
  const wait = BRI_MS - (performance.now() - briLast);
  if (wait <= 0) briSend();
  else if (!briTimer) briTimer = setTimeout(briSend, wait);
}

// The slider's position through the hysteresis band, 0..127, or null while it
// hasn't moved (or the noise stays inside the band).
function sliderValue(t, v) {
  const H = SLIDER_H;
  let o = sliderOut[t];
  if (o === undefined) {
    // not touched yet: wait for a real move away from where it was first heard
    if (sliderRaw0[t] === undefined) { sliderRaw0[t] = v; return null; }
    if (Math.abs(v - sliderRaw0[t]) <= H) return null;
    o = v > sliderRaw0[t] ? v - H : v + H;
  } else if (v > o + H) o = v - H;
  else if (v < o - H) o = v + H;
  else return null;
  if (o === sliderOut[t]) return null;
  sliderOut[t] = o;
  return Math.max(0, Math.min(127, Math.round((o - H) * 127 / (127 - 2 * H))));
}

function slider(t, value) {
  ccValue[t] = value;
  if (learning && isSlider(learning)) return assign(learning, t);
  const held = sliderHeld[t];
  if (held !== undefined) {
    delete sliderHeld[t];
    if (Math.abs(value - held) <= SLIDER_JUMP) { slider2(t, held); return slider2(t, value); }  // it was real
  }
  const last = sliderLast[t];
  if (last !== undefined && Math.abs(value - last) > SLIDER_JUMP) {
    sliderHeld[t] = value;           // wait for the next reading to agree
    return;
  }
  slider2(t, value);
}

function slider2(t, value) {
  sliderLast[t] = value;
  const s = slidersFor(t);
  const v = sliderValue(t, value);
  if (v !== null) {
    showLast(t, String(value));
    for (const name of s) if (name === "brightness") brightness(Math.round(v * 255 / 127));
  }
  drawSide();
}

function onMidi(e) {
  const [st, d1, d2] = e.data;
  const type = st & 0xf0;
  if (type === 0x90 && d2 > 0) trigger(`note:${d1}`, true);
  else if (type === 0x80 || (type === 0x90 && d2 === 0)) trigger(`note:${d1}`, false);
  else if (type === 0xb0) {
    const t = `cc:${d1}`;
    // a CC mapped to a slider (or being learned as one) is a value; any other is a switch (pedals)
    if (slidersFor(t).length || (learning && isSlider(learning))) return slider(t, d2);
    ccValue[t] = d2;
    const down = d2 >= 64;
    if (down !== triggerDown.has(t)) trigger(t, down);
    else drawSide();
  }
}

function releaseAll() {
  triggerDown.clear();
  activeFor = {};
  for (const k of [...pressed]) setKey(k, false);
  post("/api/allup", {});
  drawKeyboard();
}

// --- the keyboard picture
const WW = 22, WH = 120, BW = 13, BH = 74;
function drawKeyboard() {
  const svg = $("kbd");
  const notes = []; for (let n = LOW; n <= HIGH; n++) notes.push(n);
  const whites = notes.filter(n => !BLACK.has(n % 12));
  svg.setAttribute("viewBox", `0 0 ${whites.length * WW + 1} ${WH + 1}`);
  const selTrig = selected ? trigList(selected).map(x => splitTrig(x).base) : [];
  const css = getComputedStyle(document.documentElement);
  const col = v => css.getPropertyValue(v).trim();
  let out = "";
  const keyFor = n => resolve(`note:${n}`)[0];   // with the modifiers held, what the key does then
  const fill = (n, black) => {
    const t = `note:${n}`;
    if (triggerDown.has(t)) return col("--press");
    if (selTrig.includes(t)) return col("--sel");
    if (keyFor(n)) return col(black ? "--mapped-black" : "--mapped-white");
    return col(black ? "--black-key" : "--white-key");
  };
  const textCol = (n, black) => {
    const t = `note:${n}`;
    if (selTrig.includes(t) && !triggerDown.has(t)) return col("--sel-text");
    if (triggerDown.has(t)) return "#1b1f24";
    return black ? "#ffffff" : "#1b1f24";
  };
  let wi = 0;
  const pos = {};
  for (const n of whites) pos[n] = wi++ * WW;
  // white keys first, then black keys on top
  for (const n of whites) {
    const x = pos[n], k = keyFor(n);
    out += `<g class="key" data-note="${n}"><title>${noteName(n)} (${n})${k ? " → " + title(k) : ""}</title>` +
      `<rect x="${x + .5}" y=".5" width="${WW}" height="${WH}" rx="2" fill="${fill(n, false)}" stroke="${col("--key-edge")}"/>` +
      `<text x="${x + WW / 2 + .5}" y="${WH - 6}" font-size="8" text-anchor="middle" fill="${textCol(n, false)}"` +
      ` font-weight="${n % 12 === 0 ? 700 : 400}">${noteName(n)}</text>`;
    if (k) out += `<text transform="translate(${x + WW / 2 + 3.5} ${WH - 20}) rotate(-90)" font-size="10" font-weight="700"` +
      ` fill="${textCol(n, false)}">${title(k)}</text>`;
    out += `</g>`;
  }
  for (const n of notes.filter(n => BLACK.has(n % 12))) {
    const x = pos[n - 1] + WW - BW / 2 + .5, k = keyFor(n);
    out += `<g class="key" data-note="${n}"><title>${noteName(n)} (${n})${k ? " → " + title(k) : ""}</title>` +
      `<rect x="${x}" y=".5" width="${BW}" height="${BH}" rx="1.5" fill="${fill(n, true)}" stroke="${col("--key-edge")}"/>`;
    if (k) out += `<text transform="translate(${x + BW / 2 + 3} ${BH - 6}) rotate(-90)" font-size="9" font-weight="700"` +
      ` fill="${textCol(n, true)}">${title(k)}</text>`;
    out += `</g>`;
  }
  svg.innerHTML = out;
  const outside = selTrig.filter(t => t.startsWith("note:") && (+t.slice(5) < LOW || +t.slice(5) > HIGH));
  const mods = heldMods();
  $("kbdHint").textContent = outside.length
    ? `${title(selected)} is also on ${outside.map(label).join(", ")}, outside this keyboard's range at the centre octave.`
    : mods.length ? `Holding ${mods.map(title).join(" + ")}: the keys show what they do with it.`
    : "Click a row below to see its keys here, or click a key here to find its row. Keys being pressed light up yellow. Hold a modifier to see its combinations.";
  drawSide();
}

function drawSide() {
  const pedal = "cc:64";
  const pk = controlsFor(pedal);
  $("pedalMap").textContent = pk.length ? pk.map(title).join(", ") : "not mapped";
  $("pedalBox").classList.toggle("on", triggerDown.has(pedal));
  $("pedalBox").classList.toggle("sel", !!selected && trigList(selected).includes(pedal));
  const sl = "cc:7";
  const sk = controlsFor(sl);
  $("sliderMap").textContent = sk.length ? sk.map(title).join(", ") : "not mapped";
  $("sliderBox").classList.toggle("sel", !!selected && trigList(selected).includes(sl));
  const v = ccValue[sl], o = sliderOut[sl];
  const out = o === undefined ? null : Math.max(0, Math.min(127, Math.round((o - SLIDER_H) * 127 / (127 - 2 * SLIDER_H))));
  $("sliderBar").style.width = out === null ? "0" : `${out / 127 * 100}%`;
  $("sliderVal").textContent = v === undefined ? "move it to read" : out === null ? `${v} / 127 (move it to take over)` :
    `${v} / 127` + (sk.includes("brightness") ? ` → bri ${Math.round(out * 255 / 127)}` : "");
}

function select(c) {
  selected = selected === c ? null : c;
  document.querySelectorAll("#rows tr").forEach(tr => tr.classList.toggle("sel", tr.dataset.key === selected));
  drawKeyboard();
}

$("kbd").addEventListener("click", e => {
  const g = e.target.closest(".key");
  if (!g) return;
  const t = `note:${g.dataset.note}`;
  const c = resolve(t)[0];
  $("lastMidi").textContent = `${label(t)}` + (c ? ` → ${title(c)}` : " (not mapped)");
  if (c) { if (selected !== c) select(c); document.querySelector(`tr[data-key="${CSS.escape(c)}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
});
$("pedalBox").onclick = () => { const c = controlsFor("cc:64")[0]; if (c) select(c); };
$("sliderBox").onclick = () => { const c = controlsFor("cc:7")[0]; if (c) select(c); };

// --- the MIDI keyboard
function pickInput() {
  const sel = $("midiIn");
  const inputs = midi ? [...midi.inputs.values()] : [];
  if (input) input.onmidimessage = null;
  input = null;
  sel.innerHTML = "";
  for (const i of inputs) {
    const o = document.createElement("option");
    o.value = i.id; o.textContent = i.name; sel.appendChild(o);
  }
  sel.hidden = inputs.length < 2;
  if (!inputs.length) {
    $("midiDot").className = "dot bad";
    $("midiState").textContent = "No MIDI keyboard found";
    releaseAll();
    return;
  }
  let want = null;
  try { want = localStorage.getItem("midiInput"); } catch (_) {}
  input = inputs.find(i => i.id === want) || inputs.find(i => /keystudio|m-audio/i.test(i.name)) || inputs[0];
  sel.value = input.id;
  input.onmidimessage = onMidi;
  $("midiDot").className = "dot ok";
  $("midiState").textContent = `${input.name} connected`;
}

$("midiIn").onchange = () => {
  try { localStorage.setItem("midiInput", $("midiIn").value); } catch (_) {}
  releaseAll(); pickInput();
};

async function startMidi() {
  if (!navigator.requestMIDIAccess) {
    $("midiDot").className = "dot bad";
    $("midiState").textContent = "This browser has no Web MIDI: use Chrome";
    return;
  }
  try {
    midi = await navigator.requestMIDIAccess();
  } catch (e) {
    $("midiDot").className = "dot bad";
    $("midiState").textContent = "MIDI not allowed (allow it in the address bar, then reload)";
    return;
  }
  midi.onstatechange = () => pickInput();
  pickInput();
}

// --- the mapping table
function render() {
  const rows = $("rows");
  rows.innerHTML = "";
  const placed = new Set();
  const ordered = [];
  for (const [name, takes] of GROUPS) {
    const ks = controls().filter(k => !placed.has(k) && takes(k));
    if (!ks.length) continue;
    ks.forEach(k => placed.add(k));
    ordered.push(name, ...ks.map(k => ({ k })));
  }
  for (const item of ordered) {
    if (typeof item === "string") {
      const g = document.createElement("tr");
      g.className = "group";
      g.innerHTML = `<td colspan="5"></td>`;
      g.firstChild.textContent = item;
      rows.appendChild(g);
      continue;
    }
    const k = item.k;
    const slider = isSlider(k);
    const tr = document.createElement("tr");
    tr.dataset.key = k;
    if (pressed.has(k)) tr.classList.add("pressed");
    if (selected === k) tr.classList.add("sel");
    const trig = trigList(k);
    tr.innerHTML = `<td class="name">${title(k)}</td><td class="what"></td><td class="trig"></td>` +
      `<td><button class="learn"></button></td><td><span class="led"></span></td>`;
    tr.querySelector(".what").textContent = slider ? SLIDERS[k] : what(k);
    const cell = tr.querySelector(".trig");
    if (!trig.length) cell.innerHTML = `<span class="none">not mapped</span>`;
    for (const t of trig) {
      const chip = document.createElement("span");
      chip.className = "chip";
      const st = splitTrig(t);
      if (st.mods.length) {
        const m = document.createElement("span");
        m.className = "mod"; m.textContent = st.mods.map(title).join(" + ") + " +";
        chip.append(m, " " + label(st.base));
      } else chip.textContent = label(t);
      const x = document.createElement("button");
      x.textContent = "×"; x.title = "Remove";
      x.onclick = e => {
        e.stopPropagation();
        const list = slider ? mapping.sliders : mapping.buttons;
        list[k] = trig.filter(y => y !== t);
        const b = splitTrig(t).base;
        if (!slider && activeFor[b] && activeFor[b].includes(k)) {
          activeFor[b] = activeFor[b].filter(x => x !== k);
          setKey(k, isHeld(k));
        }
        save(); render();
      };
      chip.appendChild(x);
      cell.appendChild(chip);
    }
    const b = tr.querySelector(".learn");
    b.textContent = learning !== k ? (slider ? "Add slider" : "Add key")
      : slider ? "Move a slider… (Esc)"
      : learnMods.size ? `${MODS.filter(m => learnMods.has(m)).map(title).join(" + ")} + … (Esc)` : "Press a key, or hold a modifier and press one… (Esc)";
    b.title = slider ? "" : "Press a MIDI key to map it. For a combination, hold a modifier's MIDI key (PALETTE, LAYER, BRIGHT, PAGE) and press another.";
    b.classList.toggle("learning", learning === k);
    b.onclick = e => { e.stopPropagation(); const was = learning; stopLearning(); learning = was === k ? null : k; render(); };
    if (slider) tr.querySelector(".led").remove();
    tr.onclick = () => select(k);
    rows.appendChild(tr);
  }
  paintLeds();
  drawKeyboard();
}

let leds = [];
function paintLeds() {
  document.querySelectorAll("#rows tr").forEach(tr => {
    const el = tr.querySelector(".led");
    if (!el) return;
    const c = leds[keys.indexOf(tr.dataset.key)];
    el.style.background = c && /^[0-9a-f]{6}$/i.test(c) ? "#" + c : "transparent";
    el.title = c ? "#" + c : "no colour from the base";
  });
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && learning) { stopLearning(); render(); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawKeyboard);

let saveTimer = null;
async function save() {
  $("saveState").textContent = "Saving…";
  const r = await fetch("/api/mapping", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(mapping) }).catch(() => null);
  $("saveState").textContent = r && r.ok ? "Saved to tools/midi_keys/mapping.json" : "Could not save the mapping";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { $("saveState").textContent = ""; }, 4000);
}

$("reset").onclick = async () => {
  if (!confirm("Replace the mapping with the default one?")) return;
  releaseAll();
  const r = await fetch("/api/mapping/default").then(r => r.json());
  mapping = r.mapping; save(); render();
};
$("allUp").onclick = releaseAll;

// --- the bridge's status, once a second
let wasConnected = null;
async function poll() {
  let s = null;
  try { s = await (await fetch("/api/status", { cache: "no-store" })).json(); } catch (_) {}
  if (!s) {
    $("baseDot").className = "dot bad";
    $("baseState").textContent = "The bridge (server.py) is not running";
    $("baseSub").textContent = "python3 tools/midi_keys/server.py";
  } else {
    const b = s.base;
    $("baseDot").className = b.connected ? "dot ok" : "dot bad";
    $("baseState").textContent = b.connected ? "Connected" : "Not connected";
    $("baseSub").textContent = b.connected
      ? `${b.port} (USB ${b.serial}) · ${b.sent} commands sent` +
        (b.wled_bri !== null && b.wled_bri !== undefined ? ` · WLED brightness ${b.wled_bri}` : "") +
        (b.held.length ? ` · held: ${b.held.join(", ")}` : "")
      : `${b.error || ""} — looking for USB ${b.serial}`;
    // a base that comes back has nothing held: forget what we think is held
    if (wasConnected === false && b.connected) { triggerDown.clear(); pressed.clear(); activeFor = {}; render(); }
    wasConnected = b.connected;
    if (JSON.stringify(s.leds) !== JSON.stringify(leds)) { leds = s.leds; paintLeds(); }
    const log = $("log");
    const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.textContent = s.log.join("\n");
    if (atEnd) log.scrollTop = log.scrollHeight;
  }
  setTimeout(poll, 1000);
}

// Closing the page lets go of every key it holds on the base.
addEventListener("pagehide", () => navigator.sendBeacon("/api/allup", new Blob(["{}"], { type: "application/json" })));

(async () => {
  try {
    const s = await (await fetch("/api/status")).json();
    keys = s.keys;
    if (s.modifiers) MODS = s.modifiers;
    PALETTES = s.palettes || [];
    mapping = (await (await fetch("/api/mapping")).json()).mapping;
    if (!mapping.sliders) mapping.sliders = (await (await fetch("/api/mapping/default")).json()).mapping.sliders || {};
  } catch (_) {
    keys = [];   // the bridge isn't running: nothing to map until it is
  }
  mapping.buttons = mapping.buttons || {};
  mapping.sliders = mapping.sliders || {};
  render();
  poll();
  startMidi();
})();
</script>
</body>
