; Nibbles build override for WLED. Copy (or symlink) into a WLED checkout
; pinned to a release (currently v16.0.1) and build with PlatformIO, with
; NIBBLES_ROOT set to this repository's root, e.g.
;   NIBBLES_ROOT=/Volumes/Code/Nibbles pio run -e nibbles_dev_s3_349
; See wled/README.md.

[platformio]
default_envs = nibbles_dev_s3_349

; Development node: a Waveshare ESP32-S3-Touch-LCD-3.49 (16 MB flash, 8 MB octal
; PSRAM) standing in for the shark's WLED controller. LED data on GPIO 2 (free
; on this board), button on BOOT (GPIO 0), no relay or IR. NIBBLES_ES7210: the
; usermod sets up the board's ES7210 mic chip (I2C SDA 47 / SCL 48) for
; AudioReactive, "Generic I2S with MCLK": SD 6, WS 46, SCK 15, MCLK 7. The mic
; is the chip's input 1, the left channel; I2S_USE_RIGHT_CHANNEL undoes
; AudioReactive's IDF 4.4 left/right swap work-around, which the S3 doesn't need.
[env:nibbles_dev_s3_349]
extends = env:esp32s3dev_16MB_opi
custom_usermods = ${env:esp32s3dev_16MB_opi.custom_usermods}
  wled-nibbles = symlink://${sysenv.NIBBLES_ROOT}/wled/usermod_nibbles
lib_deps = ${env:esp32s3dev_16MB_opi.lib_deps}
  symlink://${sysenv.NIBBLES_ROOT}/shared/nibbles_link
build_flags = ${env:esp32s3dev_16MB_opi.build_flags}
  -D DATA_PINS=2 -D BTNPIN=0 -D RLYPIN=-1 -D IRPIN=-1
  -D NIBBLES_DEBUG -D NIBBLES_ES7210 -D I2S_USE_RIGHT_CHANNEL

; A brain: a Waveshare ESP32-S3-DEV-KIT-N16R8 (ESP32-S3-WROOM-1-N16R8: 16 MB
; flash, 8 MB octal PSRAM, so GPIO 33-37 are taken; on-board antenna), headless,
; in the controller's box on top of the pole. Same memory as the 3.49, so the
; same WLED build with other pins:
;   - LED output: the default bus is the board's RGB LED (WS2812, GPIO 38), one
;     LED; the real output is a network bus of 1064 LEDs (from the bench brain's
;     config), which the usermod also sends down the wire link.
;   - Wire link to the controller: TX on GPIO 17 (usermod setting wire_pin).
;   - Mic (AudioReactive, generic I2S, e.g. an INMP441): SD 4, WS 5, SCK 6.
;   - Button: BOOT (GPIO 0). USB: one USB-C to both the native USB (GPIO
;     19/20, "USB JTAG/serial") and a CH343 on UART0 (43/44), through a hub.
[env:nibbles_brain_s3]
extends = env:esp32s3dev_16MB_opi
custom_usermods = ${env:esp32s3dev_16MB_opi.custom_usermods}
  wled-nibbles = symlink://${sysenv.NIBBLES_ROOT}/wled/usermod_nibbles
lib_deps = ${env:esp32s3dev_16MB_opi.lib_deps}
  symlink://${sysenv.NIBBLES_ROOT}/shared/nibbles_link
build_flags = ${env:esp32s3dev_16MB_opi.build_flags}
  -D DATA_PINS=38 -D PIXEL_COUNTS=1 -D BTNPIN=0 -D RLYPIN=-1 -D IRPIN=-1
  -D SR_DMTYPE=1 -D I2S_SDPIN=4 -D I2S_WSPIN=5 -D I2S_CKPIN=6 -D MCLK_PIN=-1
  -D NIBBLES_DEBUG

; The shark's real controller: a classic ESP32 (4 MB flash, no PSRAM) running
; WLED 0.15.1's "ESP32_Ethernet" release with AudioReactive (I2S mic on GPIO
; 17/32/33) and 1064 LEDs on outputs 1, 2, 4, 5 (GPIO 1, 2, 4, 5; GPIO 3 is left
; free for the board's USB chip). Ethernet is off in its
; config. LED and mic pins live in its saved config, not here. Back up its
; config and presets before upgrading (wled/README.md); upgrade over the air.
;
; Lean build, to leave more RAM: no Ethernet (the shark uses Wi-Fi), Alexa,
; Hue sync, MQTT, infrared, Loxone or the Pixel Forge tool (all unused). It
; keeps the "ESP32_Ethernet" release name only because WLED 16 refuses an
; over-the-air update whose release name differs from the installed one.
[env:nibbles_shark]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods}
  wled-nibbles = symlink://${sysenv.NIBBLES_ROOT}/wled/usermod_nibbles
lib_deps = ${env:esp32dev.lib_deps}
  symlink://${sysenv.NIBBLES_ROOT}/shared/nibbles_link
build_flags = ${common.build_flags} ${esp32.build_flags} -D WLED_RELEASE_NAME=\"ESP32_Ethernet\" -D RLYPIN=-1 -D BTNPIN=-1
  -D SR_DMTYPE=-1 -D AUDIOPIN=-1 -D I2S_SDPIN=-1 -D I2S_WSPIN=-1 -D I2S_CKPIN=-1 -D MCLK_PIN=-1
  -D DATA_PINS=4
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_DISABLE_ALEXA -D WLED_DISABLE_HUESYNC -D WLED_DISABLE_MQTT -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_LOXONE -D WLED_DISABLE_PIXELFORGE

; nibbles_shark with WLED's debug log sent over UDP (port 7868) to
; NIBBLES_DEBUG_HOST, for boards whose serial pins drive LEDs. Bench use only.
; Based on esp32dev with esp32_eth's other flags, because WLED's
; net_debug.cpp doesn't compile with WLED_USE_ETHERNET (ETHClass has no
; hostByName). Ethernet is off in the shark's config anyway.
[env:nibbles_shark_debug]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods}
  wled-nibbles = symlink://${sysenv.NIBBLES_ROOT}/wled/usermod_nibbles
lib_deps = ${env:esp32dev.lib_deps}
  symlink://${sysenv.NIBBLES_ROOT}/shared/nibbles_link
build_flags = ${common.build_flags} ${esp32.build_flags} -D WLED_RELEASE_NAME=\"ESP32_Ethernet\" -D RLYPIN=-1 -D BTNPIN=-1
  -D SR_DMTYPE=-1 -D AUDIOPIN=-1 -D I2S_SDPIN=-1 -D I2S_WSPIN=-1 -D I2S_CKPIN=-1 -D MCLK_PIN=-1
  -D DATA_PINS=4
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_DEBUG -D WLED_DEBUG_HOST='"${sysenv.NIBBLES_DEBUG_HOST}"'

; nibbles_shark with Ethernet (the WT32-ETH01's LAN8720), for streaming LED
; frames to it over a cable. Set Ethernet type "WT32-ETH01" in its config.
; Note: WLED turns Wi-Fi off when Ethernet connects, which also stops ESP-NOW.
[env:nibbles_shark_eth]
extends = env:nibbles_shark
build_flags = ${env:nibbles_shark.build_flags} -D WLED_USE_ETHERNET
